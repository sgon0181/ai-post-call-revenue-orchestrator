name: Validate workflow sources
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run validate
      - run: npm run build:test && npm run validate:test
      - run: bash -n test/run-local-n8n.sh scripts/send-fixture.sh
